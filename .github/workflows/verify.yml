name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        env:
          # Keep the committed LF endings expected by Prettier.
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run format:check
  android:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Extract a clean source export
        shell: pwsh
        run: |
          npm run export:source
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Path dist/source-check | Out-Null
          tar.exe -xf "dist/CompassLink3D-v$version-source.zip" -C dist/source-check
      - name: Set up the Android toolchain
        shell: pwsh
        working-directory: dist/source-check
        run: |
          # The project's build scripts resolve Java from the source export.
          New-Item -ItemType Directory -Path .tools | Out-Null
          New-Item -ItemType Junction -Path .tools/jdk -Target $env:JAVA_HOME | Out-Null
          npm run setup:android
      - name: Build and test the Android app
        working-directory: dist/source-check
        run: npm run test:android
